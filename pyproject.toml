[project]
name = "llm-mojo"
version = "0.1.0"
description = "LLM inference from first principles in Mojo, initially targeting Apple Silicon"
readme = "README.md"
authors = [
    { name = "Attilio Castano", email = "attiliocastanom@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "max>=26.5.0",
    "mojo>=1.0.0",
    "numpy>=2.5.2",
    "typer>=0.16,<1",
]

[project.scripts]
llm-mojo = "llm_mojo.cli.app:main"
llm-mojo-tokenizer = "llm_mojo.models.qwen2.tokenizer_assets:main"
llm-mojo-validate = "llm_mojo.validation.suite:main"
llm-mojo-bench = "llm_mojo.benchmarks.run:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "llm-mojo"
version = "0.1.0"
description = "LLM inference from first principles in Mojo, initially targeting Apple Silicon"
readme = "README.md"
authors = [
    { name = "Attilio Castano", email = "attiliocastanom@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "max>=26.5.0",
    "mojo>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
